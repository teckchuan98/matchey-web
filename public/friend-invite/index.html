<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b11">
  <meta name="description" content="A friend invited you to join their trail on Fittel.">
  <meta property="og:title" content="Come join my trail on Fittel">
  <meta property="og:description" content="Log meals, build your rhythm, and explore together.">
  <meta property="og:type" content="website">
  <meta name="apple-itunes-app" id="smart-app-banner" content="app-id=6762073840">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Join my trail on Fittel</title>
  <style>
    :root {
      color-scheme: dark;
      --blue: #4d8fff;
      --blue-soft: #75aaff;
      --surface: rgba(19, 24, 34, 0.88);
      --line: rgba(255, 255, 255, 0.13);
      --text: #f7f9ff;
      --muted: #aab3c2;
      --danger: #ff6b7e;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #080b11;
    }

    body {
      min-height: 100svh;
      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 8%, rgba(77, 143, 255, 0.19), transparent 34%),
        radial-gradient(circle at 20% 82%, rgba(77, 143, 255, 0.08), transparent 30%),
        #080b11;
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(380px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.015) 34%),
        var(--surface);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
      backdrop-filter: blur(24px) saturate(130%);
      text-align: center;
    }

    .logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      display: block;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(23, 93, 218, 0.34);
    }

    .avatar {
      width: 68px;
      height: 68px;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 2px solid rgba(117, 170, 255, 0.7);
      border-radius: 50%;
      background: linear-gradient(145deg, #68a5ff, #216bd9);
      box-shadow: 0 10px 28px rgba(33, 107, 217, 0.27);
      color: white;
      font-size: 26px;
      font-weight: 700;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    h1 {
      margin: 0;
      overflow: hidden;
      color: white;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .message {
      margin: 8px auto 0;
      max-width: 290px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.42;
    }

    .code {
      margin: 19px 0;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(117, 170, 255, 0.36);
      border-radius: 15px;
      background: rgba(77, 143, 255, 0.08);
    }

    .code span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .code strong {
      color: #8bb7ff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .button {
      width: 100%;
      min-height: 56px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #68a5ff, var(--blue));
      box-shadow: 0 13px 30px rgba(42, 108, 224, 0.31);
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
      transition: transform 150ms ease, opacity 150ms ease;
    }

    .button:active { transform: scale(0.985); }
    .button[aria-disabled="true"] { opacity: 0.42; pointer-events: none; }

    .status {
      min-height: 17px;
      margin: 10px 0 0;
      color: var(--blue-soft);
      font-size: 12px;
      font-weight: 500;
    }

    .error {
      display: none;
      margin: -3px 0 15px;
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }

    .hint {
      margin: 0;
      color: #7d8797;
      font-size: 11px;
      line-height: 1.45;
    }

    @media (max-height: 580px) {
      body { overflow: auto; place-items: start center; }
      .card { padding: 18px 22px; }
      .logo { width: 44px; height: 44px; margin-bottom: 12px; }
      .avatar { width: 56px; height: 56px; margin-bottom: 10px; }
      .code { margin: 14px 0; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/brand/logo.png" alt="Fittel">
    <div class="avatar" id="avatar" aria-hidden="true">F</div>
    <h1 id="headline">A friend invited you</h1>
    <p class="message">Open Fittel to become friends and join their trail.</p>

    <div class="code">
      <span>Private invite</span>
      <strong id="code">────────</strong>
    </div>

    <p class="error" id="error">
      This friend invitation is invalid, expired, or already used.
    </p>

    <button class="button" id="continue" type="button">
      <span>↗</span>
      <span id="button-label">Open or download Fittel</span>
    </button>

    <p class="status" id="status" aria-live="polite"></p>
    <p class="hint">Your meal photos and nutrition remain private.</p>
  </main>

  <script>
    const API_BASE = 'https://fittel-backend.onrender.com/api';
    const IOS_STORE_URL = 'https://apps.apple.com/app/id6762073840';
    const IOS_STORE_APP_URL =
      'itms-apps://itunes.apple.com/app/id6762073840';
    const ANDROID_STORE_URL =
      'https://play.google.com/apps/testing/com.teckchuan.fittel';

    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').trim().toUpperCase();
    const inviteUrl = window.location.href;
    const userAgent = navigator.userAgent || '';
    const isAndroid = /android/i.test(userAgent);
    const isIOS = /iphone|ipad|ipod/i.test(userAgent) ||
      (/macintosh/i.test(userAgent) && navigator.maxTouchPoints > 1);
    const isMobile = isAndroid || isIOS;
    const storeUrl = isAndroid ? ANDROID_STORE_URL : IOS_STORE_URL;
    const continueButton = document.getElementById('continue');
    const status = document.getElementById('status');
    const error = document.getElementById('error');
    let storeFallbackTimer = null;
    let handoffStarted = false;

    document.getElementById('code').textContent = code || '────────';
    document.getElementById('smart-app-banner').content =
      `app-id=6762073840, app-argument=${inviteUrl}`;

    if (isAndroid) {
      document.getElementById('button-label').textContent =
        'Open or download Fittel';
    } else if (!isIOS) {
      document.getElementById('button-label').textContent =
        'Download Fittel for iPhone';
    }

    function fallbackCopy(text) {
      try {
        const field = document.createElement('textarea');
        field.value = text;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        field.remove();
      } catch (_) {}
    }

    function preserveInvite() {
      fallbackCopy(inviteUrl);
      try {
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(inviteUrl).catch(() => {});
        }
      } catch (_) {}
    }

    function openStore({ native = false } = {}) {
      preserveInvite();
      status.textContent = isAndroid
        ? 'Opening Google Play…'
        : 'Opening the App Store…';
      window.location.href = native && isIOS ? IOS_STORE_APP_URL : storeUrl;
    }

    function startAppHandoff() {
      if (!code || handoffStarted) return;
      handoffStarted = true;
      preserveInvite();

      if (!isMobile) {
        openStore();
        return;
      }

      status.textContent = 'Opening Fittel…';
      let appOpened = false;
      const markOpened = () => {
        if (document.hidden) appOpened = true;
      };
      document.addEventListener('visibilitychange', markOpened, { once: true });
      window.addEventListener('pagehide', () => { appOpened = true; }, { once: true });

      storeFallbackTimer = window.setTimeout(() => {
        if (!appOpened && !document.hidden) openStore({ native: true });
      }, 2000);

      if (isAndroid) {
        const fallback = encodeURIComponent(ANDROID_STORE_URL);
        window.location.href =
          `intent://friend-invite?code=${encodeURIComponent(code)}` +
          '#Intent;scheme=fittel;package=com.teckchuan.fittel;' +
          `S.browser_fallback_url=${fallback};end`;
      } else {
        window.location.href =
          `fittel://friend-invite?code=${encodeURIComponent(code)}`;
      }
    }

    continueButton.addEventListener('click', () => {
      if (storeFallbackTimer) window.clearTimeout(storeFallbackTimer);
      handoffStarted = false;
      startAppHandoff();
    });

    if (!code) {
      error.style.display = 'block';
      continueButton.setAttribute('aria-disabled', 'true');
    } else {
      fetch(`${API_BASE}/friend-invites/lookup?code=${encodeURIComponent(code)}`)
        .then((response) => {
          if (!response.ok) throw new Error('invalid');
          return response.json();
        })
        .then((invite) => {
          const inviterName = (invite.inviterName || 'Your friend').trim();
          document.getElementById('headline').textContent = `${inviterName} invited you`;
          document.getElementById('avatar').textContent =
            inviterName.slice(0, 1).toUpperCase();
          if (invite.inviterPhotoUrl) {
            const image = document.createElement('img');
            image.src = invite.inviterPhotoUrl;
            image.alt = '';
            document.getElementById('avatar').replaceChildren(image);
          }
        })
        .catch(() => {
          error.style.display = 'block';
          continueButton.setAttribute('aria-disabled', 'true');
        });

      // Preserve the launch behavior that users already know: first ask the
      // operating system to open Fittel. If no installed app handles the
      // custom scheme, the timer opens the native store instead.
      if (isMobile) window.setTimeout(startAppHandoff, 350);
    }
  </script>
</body>
</html>
