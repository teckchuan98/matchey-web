<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join me on Fittel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px 20px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    /* ── Header: avatar + name on a single compact row ───────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .avatar, .avatar-placeholder {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .avatar { object-fit: cover; }
    .avatar-placeholder {
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #1d4ed8;
    }
    .name-block { text-align: left; line-height: 1.25; }
    .name-block h1 {
      font-size: 17px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 2px;
    }
    .name-block .invited-by {
      font-size: 12px;
      color: #94a3b8;
    }

    /* ── Primary CTA ──────────────────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }

    /* ── Allow-paste visual ──────────────────────────────────────────── */
    .allow-block { margin-top: 14px; }
    .allow-caption {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .allow-caption strong { color: #fbbf24; }
    .allow-img {
      width: 100%;
      max-width: 220px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
    }

    /* ── Secondary fallbacks (below fold) ─────────────────────────────── */
    .divider { border: none; border-top: 1px solid #334155; margin: 20px 0 14px; }
    .fallback-label { color: #94a3b8; font-size: 12px; margin-bottom: 10px; line-height: 1.4; }
    .code-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      color: #94a3b8;
      font-size: 12px;
    }
    .code-pill {
      background: #0f172a;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #1d4ed8;
    }
    .footnote { color: #475569; font-size: 11px; margin-top: 14px; line-height: 1.5; }

    #install-section { display: none; }
    #opening-msg { color: #94a3b8; font-size: 14px; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Header: small avatar + name on one row (always visible) -->
    <div class="header">
      <div class="avatar-placeholder" id="avatar-placeholder">F</div>
      <img id="avatar-img" class="avatar" style="display:none" alt="">
      <div class="name-block">
        <h1 id="trainer-name">Your trainer</h1>
        <div class="invited-by">invited you to Fittel</div>
      </div>
    </div>

    <p id="opening-msg">Opening Fittel…</p>

    <div id="install-section">
      <!-- Primary CTA: visible immediately, no scroll needed -->
      <a class="btn btn-primary" id="install-btn" href="https://testflight.apple.com/join/dx7zdwdw">
        Download Fittel on TestFlight
      </a>

      <!-- Visual instruction: when iOS asks, tap Allow -->
      <div class="allow-block">
        <p class="allow-caption">
          After installing, open Fittel and tap <strong>Allow Paste</strong> when iOS asks:
        </p>
        <img class="allow-img" src="/images/paste.png" alt="Tap Allow when iOS asks &quot;Allow Paste&quot;">
      </div>

      <!-- Below-fold fallbacks -->
      <hr class="divider">
      <p class="fallback-label">Didn't see the prompt? Copy the link, then open Fittel.</p>
      <button class="btn btn-secondary" id="copy-btn">Copy invite link</button>

      <div class="code-row">
        Or enter code <span class="code-pill" id="code-display">——</span>
      </div>

      <p class="footnote">If you already installed Fittel, just tap your trainer's link again.</p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://fittel-backend.onrender.com/api';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';

    function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      } catch (_) {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) { /* give up silently */ }
    }

    if (code) {
      document.getElementById('code-display').textContent = code;
      const inviteUrl = window.location.href;

      // Best-effort auto-copy on page load (often blocked without a user gesture).
      copyToClipboard(inviteUrl);

      // Guaranteed copy on the install button tap (real user gesture).
      const installBtn = document.getElementById('install-btn');
      if (installBtn) {
        installBtn.addEventListener('click', () => copyToClipboard(inviteUrl));
      }

      // Manual copy button.
      const copyBtn = document.getElementById('copy-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          copyToClipboard(inviteUrl);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy invite link'; }, 1500);
        });
      }

      // Try to open the app via custom URL scheme (no-op if not installed).
      window.location.href = 'fittel://invite?code=' + encodeURIComponent(code);

      setTimeout(() => {
        document.getElementById('opening-msg').style.display = 'none';
        document.getElementById('install-section').style.display = 'block';
      }, 1800);
    } else {
      document.getElementById('opening-msg').style.display = 'none';
      document.getElementById('install-section').style.display = 'block';
    }

    // Personalise the page with trainer info
    if (code) {
      fetch(`${API_BASE}/client-invites/lookup?code=${encodeURIComponent(code)}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data) return;
          if (data.trainerName) {
            document.getElementById('trainer-name').textContent = data.trainerName;
          }
          if (data.trainerPhotoUrl) {
            const img = document.getElementById('avatar-img');
            img.src = data.trainerPhotoUrl;
            img.style.display = 'block';
            document.getElementById('avatar-placeholder').style.display = 'none';
          } else {
            const initial = (data.trainerName || 'F').charAt(0).toUpperCase();
            document.getElementById('avatar-placeholder').textContent = initial;
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
