<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join me on Fittel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      display: block;
    }
    .avatar-placeholder {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #334155;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #1d4ed8;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
    .subtitle { color: #94a3b8; font-size: 15px; line-height: 1.5; margin-bottom: 32px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .divider { border: none; border-top: 1px solid #334155; margin: 24px 0; }
    .fallback-label { color: #64748b; font-size: 13px; margin-bottom: 12px; }
    .code-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #1d4ed8;
    }
    .footnote { color: #475569; font-size: 12px; margin-top: 16px; line-height: 1.6; }
    #install-section { display: none; }
    #opening-msg { color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-placeholder" id="avatar-placeholder">F</div>
    <img id="avatar-img" class="avatar" style="display:none" alt="">
    <h1 id="trainer-name">Your trainer</h1>
    <p class="subtitle">has invited you to train together on Fittel.</p>

    <p id="opening-msg">Open Fittel to continue, or use the button below.</p>

    <div id="install-section">
      <a class="btn btn-primary" id="open-app-btn" href="#">
        Open Fittel
      </a>
      <a class="btn btn-primary" href="https://testflight.apple.com/join/dx7zdwdw">
        Download Fittel on TestFlight
      </a>
      <hr class="divider">
      <p class="fallback-label">Already have the app? Open Fittel and enter this code:</p>
      <div class="code-box" id="code-display">——</div>
      <p class="footnote">If the app did not open automatically, tap Open Fittel above.</p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://fittel-backend.onrender.com/api';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';
    const openAppBtn = document.getElementById('open-app-btn');

    if (code) {
      document.getElementById('code-display').textContent = code;
      openAppBtn.href = 'fittel://invite?code=' + encodeURIComponent(code);
    } else {
      openAppBtn.href = 'fittel://invite';
    }

    document.getElementById('opening-msg').style.display = 'none';
    document.getElementById('install-section').style.display = 'block';

    // Personalise the page with trainer info
    if (code) {
      fetch(`${API_BASE}/client-invites/lookup?code=${encodeURIComponent(code)}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data) return;
          if (data.trainerName) {
            document.getElementById('trainer-name').textContent = data.trainerName;
          }
          if (data.trainerPhotoUrl) {
            const img = document.getElementById('avatar-img');
            img.src = data.trainerPhotoUrl;
            img.style.display = 'block';
            document.getElementById('avatar-placeholder').style.display = 'none';
          } else {
            const initial = (data.trainerName || 'F').charAt(0).toUpperCase();
            document.getElementById('avatar-placeholder').textContent = initial;
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
