<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join me on Fittel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      display: block;
    }
    .avatar-placeholder {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #334155;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #1d4ed8;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
    .subtitle { color: #94a3b8; font-size: 15px; line-height: 1.5; margin-bottom: 32px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .btn-primary { background: #1d4ed8; color: #fff; }
    .divider { border: none; border-top: 1px solid #334155; margin: 24px 0; }
    .fallback-label { color: #64748b; font-size: 13px; margin-bottom: 12px; }
    .code-box {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #1d4ed8;
    }
    .footnote { color: #475569; font-size: 12px; margin-top: 16px; line-height: 1.6; }
    #install-section { display: none; }
    #opening-msg { color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-placeholder" id="avatar-placeholder">F</div>
    <img id="avatar-img" class="avatar" style="display:none" alt="">
    <h1 id="trainer-name">Your trainer</h1>
    <p class="subtitle">has invited you to train together on Fittel.</p>

    <p id="opening-msg">Opening Fittel…</p>

    <div id="install-section">
      <a class="btn btn-primary" id="install-btn" href="https://testflight.apple.com/join/dx7zdwdw">
        Download Fittel on TestFlight
      </a>
      <hr class="divider">
      <p class="fallback-label">Already have the app? Open Fittel and enter this code:</p>
      <div class="code-box" id="code-display">——</div>
      <button class="btn btn-primary" id="copy-btn" style="margin-top:12px;background:#334155">Copy invite link</button>
      <p class="footnote">Or re-tap this link after installing.</p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://fittel-backend.onrender.com/api';

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || '';

    // Robust copy: works even in WebViews that block async Clipboard API.
    // Tries navigator.clipboard.writeText first; falls back to a temporary
    // textarea + document.execCommand('copy'), which works synchronously
    // inside a user-gesture handler and is supported by WhatsApp's WKWebView.
    function copyToClipboard(text) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      } catch (_) {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'absolute';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (_) { /* give up silently */ }
    }

    if (code) {
      document.getElementById('code-display').textContent = code;

      const inviteUrl = window.location.href;

      // Best-effort auto-copy on page load (often blocked without a user gesture).
      copyToClipboard(inviteUrl);

      // Guaranteed copy on the install button tap (real user gesture).
      // The href to TestFlight still fires — copy is synchronous before nav.
      const installBtn = document.getElementById('install-btn');
      if (installBtn) {
        installBtn.addEventListener('click', () => copyToClipboard(inviteUrl));
      }

      // Manual copy button.
      const copyBtn = document.getElementById('copy-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          copyToClipboard(inviteUrl);
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy invite link'; }, 1500);
        });
      }

      // Immediately try to open the app via custom URL scheme.
      // If Fittel is installed, iOS intercepts this and opens the app.
      // The page stays open in WhatsApp's browser in the background.
      window.location.href = 'fittel://invite?code=' + encodeURIComponent(code);

      // If the app was NOT installed, the redirect above does nothing.
      // After 1.8s reveal the download button.
      setTimeout(() => {
        document.getElementById('opening-msg').style.display = 'none';
        document.getElementById('install-section').style.display = 'block';
      }, 1800);
    } else {
      document.getElementById('opening-msg').style.display = 'none';
      document.getElementById('install-section').style.display = 'block';
    }

    // Personalise the page with trainer info
    if (code) {
      fetch(`${API_BASE}/client-invites/lookup?code=${encodeURIComponent(code)}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (!data) return;
          if (data.trainerName) {
            document.getElementById('trainer-name').textContent = data.trainerName;
          }
          if (data.trainerPhotoUrl) {
            const img = document.getElementById('avatar-img');
            img.src = data.trainerPhotoUrl;
            img.style.display = 'block';
            document.getElementById('avatar-placeholder').style.display = 'none';
          } else {
            const initial = (data.trainerName || 'F').charAt(0).toUpperCase();
            document.getElementById('avatar-placeholder').textContent = initial;
          }
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
